<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Request an Event | Stadium Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      const getBaseUrl = () => {
        const hostname = window.location.hostname;
        // 1. Detect if we are working locally
        if (hostname === 'localhost' || hostname === '127.0.0.1') {
          return 'http://localhost:3000';
        }
        // 2. Automated Production URL
        return 'https://venuecore-app-745522474629.us-central1.run.app';
      };

      async function handleRequest(e) {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMsg');

        submitBtn.disabled = true;
        submitBtn.innerText = 'Submitting...';
        statusMsg.className = 'mt-4 p-3 rounded hidden';

        const formData = new FormData(e.target);
        const payload = Object.fromEntries(formData.entries());

        payload.source = 'PUBLIC_FORM';
        payload.role = 'Client';
        payload.status = 'Pending';

        try {
          const response = await fetch(`${getBaseUrl()}/api/event-requests`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          if (!response.ok) {
            const err = await response.json();
            throw new Error(err.message || 'Submission failed');
          }

          statusMsg.innerText =
            "Success! Your request has been sent. Check your system's Client tab!";
          statusMsg.className = 'mt-4 p-3 rounded bg-green-100 text-green-800';
          e.target.reset();
        } catch (error) {
          statusMsg.innerText = 'Error: ' + error.message;
          statusMsg.className = 'mt-4 p-3 rounded bg-red-100 text-red-800';
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerText = 'Send Request';
        }
      }

      window.onload = () => {
        document.getElementById('requestForm').addEventListener('submit', handleRequest);
      };
    </script>
  </head>
  <body class="bg-slate-50 min-h-screen py-12 px-4 font-sans">
    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-lg p-8">
      <header class="text-center mb-10">
        <h1 class="text-3xl font-bold text-slate-900">Event Inquiry</h1>
        <p class="text-slate-500 mt-2">Submit your details to start the booking process.</p>
      </header>

      <form id="requestForm" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1"
              >First Name</label
            >
            <input
              type="text"
              name="firstName"
              required
              class="w-full p-3 border rounded-lg outline-blue-500"
            />
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1"
              >Last Name</label
            >
            <input
              type="text"
              name="lastName"
              required
              class="w-full p-3 border rounded-lg outline-blue-500"
            />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1"
            >Email Address</label
          >
          <input
            type="email"
            name="email"
            required
            class="w-full p-3 border rounded-lg outline-blue-500"
          />
        </div>

        <div class="pt-6 border-t">
          <h3 class="font-bold text-slate-800 mb-4">Event Details</h3>
          <div class="space-y-4">
            <div>
              <label class="block text-xs font-semibold uppercase text-slate-500 mb-1"
                >Event Name</label
              >
              <input
                type="text"
                name="eventName"
                required
                class="w-full p-3 border rounded-lg outline-blue-500"
              />
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1"
                  >Venue</label
                >
                <select name="location" class="w-full p-3 border rounded-lg outline-blue-500">
                  <option value="SoFi Stadium">SoFi Stadium</option>
                  <option value="YouTube Theater">YouTube Theater</option>
                  <option value="Intuit Dome">Intuit Dome</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1"
                  >Category</label
                >
                <select name="category" class="w-full p-3 border rounded-lg outline-blue-500">
                  <option value="Rams Game">Rams Game</option>
                  <option value="Chargers Game">Chargers Game</option>
                  <option value="Sport: NFL (Other)">Sport: NFL (Other)</option>
                  <option value="Sport: Other">Sport: Other</option>
                  <option value="Concert/Musical Act">Concert/Musical Act</option>
                  <option value="Corporate/Private Event">Corporate/Private Event</option>
                  <option value="Filming/Production">Filming/Production</option>
                  <option value="Other">Other</option>
                </select>
              </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1"
                  >Proposed Start</label
                >
                <input
                  type="date"
                  name="startDate"
                  required
                  class="w-full p-3 border rounded-lg outline-blue-500"
                />
              </div>
              <div>
                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1"
                  >Proposed End</label
                >
                <input
                  type="date"
                  name="endDate"
                  required
                  class="w-full p-3 border rounded-lg outline-blue-500"
                />
              </div>
            </div>
          </div>
        </div>

        <button
          type="submit"
          id="submitBtn"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-lg shadow-md transition-all"
        >
          Submit Inquiry
        </button>
        <div id="statusMsg" class="hidden"></div>
      </form>
    </div>
  </body>
</html>
